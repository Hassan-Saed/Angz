<section class="space-y-4 p-4 sm:p-6 min-h-[calc(100dvh-3.5rem)]">
  <header class="animate-fade-in-down">
    <h1 class="text-2xl font-bold"><app-typewriter [text]="i18n.t('Billing')" [speed]="45" /></h1>
  </header>

  <div class="card p-4 animate-fade-in-up stagger-1 hover:shadow-md transition-all duration-300">
    <h2 class="font-semibold">{{ i18n.t('PlanTrial') }}</h2>
    <p class="mt-1 text-lg font-bold text-forest-600">{{ i18n.t('PlanTrial') }}</p>
  </div>

  <div class="card p-4 animate-fade-in-up stagger-2 hover:shadow-md transition-all duration-300">
    <h2 class="font-semibold">{{ i18n.t('TrialDaysLeft') }}</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      {{ i18n.t('TrialEndsOn', { date: auth.user()?.trialEndsAt ?? '' }) }}
    </p>
  </div>

  <button
    type="button"
    (click)="upgrade()"
    class="w-full rounded-xl bg-earth-600 hover:bg-earth-700 px-4 py-3 text-sm font-semibold text-white transition-all duration-200 hover:shadow-lg animate-fade-in-up stagger-3"
  >
    {{ i18n.t('UpgradeNow') }}
  </button>
</section>
