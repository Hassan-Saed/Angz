<section class="flex flex-col h-[calc(100dvh-3.5rem)] max-w-4xl mx-auto p-4 sm:p-6">

  <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4 mb-4 shrink-0 animate-fade-in-down">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-2xl bg-forest-600 text-white flex items-center justify-center shadow-md animate-scale-in">
        <app-icon name="sparkle" />
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white"><app-typewriter [text]="i18n.t('AiAgent')" [speed]="45" /></h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">{{ i18n.t('AiSubtitle') }}</p>
      </div>
    </div>

    <button
      type="button"
      (click)="clear()"
      class="rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-1.5 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all duration-200"
    >
      {{ i18n.t('ClearChat') }}
    </button>
  </header>

  <div class="flex flex-wrap gap-2 mb-4 shrink-0 animate-fade-in-up stagger-1">
    <button
      type="button"
      (click)="sendSuggestion(i18n.t('SuggestionPriority'))"
      class="rounded-full border border-forest-200 dark:border-forest-900/60 bg-forest-50 dark:bg-forest-950/40 px-3.5 py-1.5 text-xs font-semibold text-forest-700 dark:text-forest-300 hover:bg-forest-100 transition-all duration-200"
    >
      {{ i18n.t('SuggestionPriority') }}
    </button>
    <button
      type="button"
      (click)="sendSuggestion(i18n.t('SuggestionPlan'))"
      class="rounded-full border border-forest-200 dark:border-forest-900/60 bg-forest-50 dark:bg-forest-950/40 px-3.5 py-1.5 text-xs font-semibold text-forest-700 dark:text-forest-300 hover:bg-forest-100 transition-all duration-200"
    >
      {{ i18n.t('SuggestionPlan') }}
    </button>
    <button
      type="button"
      (click)="sendSuggestion(i18n.t('SuggestionProgress'))"
      class="rounded-full border border-emerald-200 dark:border-emerald-900/60 bg-emerald-50 dark:bg-emerald-950/40 px-3.5 py-1.5 text-xs font-semibold text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 transition-all duration-200"
    >
      {{ i18n.t('SuggestionProgress') }}
    </button>
  </div>

  <ul #scrollContainer class="flex-1 space-y-4 overflow-y-auto pe-1 pb-4">
    @for (message of agent.messages(); track message.id) {
      <li class="flex animate-fade-in-up" [class.justify-end]="message.role === 'user'">
        <div class="flex items-start gap-2.5 max-w-[85%] sm:max-w-[75%]" [class.flex-row-reverse]="message.role === 'user'">

          <div class="h-8 w-8 shrink-0 rounded-full flex items-center justify-center"
               [class.bg-forest-600]="message.role === 'user'"
               [class.bg-earth-600]="message.role === 'assistant'">
            <app-icon [name]="message.role === 'user' ? 'user' : 'sparkle'" sizeClass="h-4 w-4" />
          </div>

          <article
            class="rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm whitespace-pre-line"
            [class.bg-forest-600]="message.role === 'user'"
            [class.text-white]="message.role === 'user'"
            [class.rounded-tr-none]="message.role === 'user'"
            [class.bg-white]="message.role === 'assistant'"
            [class.dark:bg-slate-900]="message.role === 'assistant'"
            [class.border]="message.role === 'assistant'"
            [class.border-slate-200]="message.role === 'assistant'"
            [class.dark:border-slate-800]="message.role === 'assistant'"
            [class.rounded-tl-none]="message.role === 'assistant'"
          >
            {{ message.content }}
          </article>

        </div>
      </li>
    }

    @if (agent.loading()) {
      <li class="flex animate-fade-in-up">
        <div class="flex items-center gap-2 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-3 text-sm text-slate-500">
          <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-forest-600 border-t-transparent"></span>
          <span>{{ i18n.t('AiThinking') }}</span>
        </div>
      </li>
    }
  </ul>

  <form
    class="shrink-0 flex items-center gap-2 pt-2 border-t border-slate-200 dark:border-slate-800"
    (submit)="$event.preventDefault(); send()"
  >
    <input
      [value]="draft()"
      (input)="draft.set($any($event.target).value)"
      placeholder="{{ i18n.t('AiPlaceholder') }}"
      class="min-w-0 flex-1 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:border-forest-500 focus:outline-none shadow-sm transition-all duration-200"
    />
    <button
      type="submit"
      [disabled]="agent.loading() || !draft().trim()"
      class="rounded-2xl bg-forest-600 hover:bg-forest-700 px-5 py-3 text-sm font-bold text-white transition-all duration-200 disabled:opacity-50 shadow-sm shrink-0 hover:shadow-lg"
    >
      {{ i18n.t('Send') }}
    </button>
  </form>

</section>
